# iPipe / BuildCloud 云端编译配置。字段规范：http://buildcloud.baidu.com/ci_yml/2-config_format_spec
#
# Multica 是「Go + Node/pnpm monorepo + Electron」三栈仓库。写法参考 baidu 其他仓库
# （dumate-console-init / qianfan-pro-fe / qianfan-desktop-app / dumate-app-ci）：
#   - Default.profile 只放一个 Linux 全量编译 profile（build），流水线「编译」阶段不用改配置；
#   - test / daemon / web / 桌面端 这些 profile 需要时在 iPipe 里单独加一个阶段选中它。
#     同一个 Default 里并列多个 profile 会并行抢同一个构建工作区，实测一起跑会互相踩。
#
# 改这个文件前先看三条硬约束（都踩过）：
#   1. build.command 里不要写 $VAR / ${VAR}：平台会在下发命令前把 $变量替换成空。
#      例如 PNPM='pnpm --x' 再 $PNPM install，实际执行的是 " install"，命令直接失败。
#   2. 工具版本必须是 deck 白名单里的值，否则 Stage 2 解析 ci.yml 就报
#      "Invalid tool version ..."。go 最高到 1.27.latest；pnpm 只有
#      10.0.0/10.13.1/11.1.3/11.3.0/12.15.0，而仓库 package.json 写的是 pnpm@10.28.2，
#      所以在命令里用 npm i -g pnpm@10.28.2 对齐。
#   3. 产物统一写 output/，artifacts.release 上传的就是这个目录，没有 output/ 会报 [Error:8006]。

Global:
  version: 2.0
  group_email: wangjianghua@baidu.com   # 接收 xx.latest 版本升级通知

Default:
  profile: [build]

Profiles:
  # ---------------------------------------------------------------------------
  # build：默认 Linux 全量编译（Go 三个二进制 + 前端 web），流水线「编译」阶段跑这个
  # ---------------------------------------------------------------------------
  - profile:
    name: build
    mode: AGENT
    environment:
      image: DECK_STD_CENTOS7
      resourceType: LARGE
      tools:
        - go: 1.27.latest      # server/go.mod 要求 go >= 1.26.9，deck 提供到 1.27.latest
        - gcc: 12
        - nodejs: 22.latest    # package.json engines: node >= 22
        - pnpm: 10.13.1        # 只为把 pnpm 放进 PATH，真正使用的版本在命令里升到 10.28.2
    build:
      command: |
        set -euo pipefail
        # 构建机连不上 proxy.golang.org，Go 依赖走内网 goproxy
        export GOPROXY=https://goproxy.baidu-int.com,direct
        mkdir -p output

        # Go：server（后端）、multica（CLI + daemon）、migrate（建表/迁移）
        # -X main.version / main.commit 由 Makefile 用 git describe 注入，这里不用自己拼
        make build
        cp server/bin/server server/bin/multica server/bin/migrate output/

        # 前端：pnpm 版本对齐 package.json 的 packageManager，再按锁文件安装
        npm i -g pnpm@10.28.2 --no-fund --no-audit
        pnpm install --frozen-lockfile
        pnpm typecheck

        # 站点打包：STANDALONE=true 让 next.config 输出 standalone（Dockerfile.web 用同一个开关）
        STANDALONE=true pnpm --filter @multica/web build
        mkdir -p output/web
        cp -R apps/web/.next/standalone/. output/web/
        mkdir -p output/web/apps/web/.next
        cp -R apps/web/.next/static output/web/apps/web/.next/static
        cp -R apps/web/public output/web/apps/web/public
        tar -czf output/multica-web.tar.gz -C output/web .

        ls -l output
      cache:
        enable: true
        trimThresholdSize: 6
    check:
      - reuse: TASK
        enable: true
    artifacts:
      release: true

  # ---------------------------------------------------------------------------
  # test：质量门禁（Go vet/单测 + 前端 lint/单测）。需要时在 iPipe 里单独加阶段
  # ---------------------------------------------------------------------------
  - profile:
    name: test
    mode: AGENT
    environment:
      image: DECK_STD_CENTOS7
      resourceType: LARGE
      tools:
        - go: 1.27.latest
        - gcc: 12
        - nodejs: 22.latest
        - pnpm: 10.13.1
    build:
      command: |
        set -euo pipefail
        # 构建机连不上 proxy.golang.org，Go 依赖走内网 goproxy
        export GOPROXY=https://goproxy.baidu-int.com,direct
        mkdir -p output

        # Go：全量编译 + vet，再跑单测
        ( cd server && go build ./... && go vet ./... )

        # 4 个用例依赖真实 systemd 用户会话（systemctl --user），构建容器里没有会话，
        # 会报 "unit still wants-linked"：先单独跑一遍留日志（不阻断），再从正式门禁里剔除
        ( cd server && go test ./cmd/multica -run 'TestPlatformReadAutostart|TestPlatformRemoveAutostart|TestDisableKeepsRunningServiceRecoverable' -count=1 ) > output/test-go-systemd.log 2>&1 || true
        GOFLAGS='-skip=TestPlatformRemoveAutostartKeepsUnmarkedXdgAlongsideManagedUnit|TestDisableKeepsRunningServiceRecoverable' bash scripts/test-go.sh 2>&1 | tee output/test-go.log

        # 前端：锁文件安装 + lint + 单测。
        # test 必须 --concurrency=1：一个包一个包跑；多包并行会 OOM，
        # 而且 views 里有 5s 超时的用例，抢 CPU 时会抖动失败（已实测）
        npm i -g pnpm@10.28.2 --no-fund --no-audit
        pnpm install --frozen-lockfile
        pnpm lint
        pnpm test --concurrency=1
      cache:
        enable: true
        trimThresholdSize: 6
    check:
      - reuse: TASK
        enable: true
    artifacts:
      release: true

  # ---------------------------------------------------------------------------
  # daemon：CLI / daemon 二进制，一次出 Linux、macOS、Windows 五个平台
  # （daemon 是 CLI 的子命令 multica daemon start，和 CLI 是同一个二进制）
  # ---------------------------------------------------------------------------
  - profile:
    name: daemon
    mode: AGENT
    environment:
      image: DECK_STD_CENTOS7
      resourceType: MEDIUM
      tools:
        - go: 1.27.latest
        - gcc: 12
    build:
      command: |
        set -euo pipefail
        # 构建机连不上 proxy.golang.org，Go 依赖走内网 goproxy
        export GOPROXY=https://goproxy.baidu-int.com,direct
        mkdir -p output
        # CGO 关掉才能交叉编译；Makefile 会自动给 windows 产物加 .exe
        export CGO_ENABLED=0
        make build GOOS=linux GOARCH=amd64
        cp server/bin/multica output/multica-linux-amd64
        make build GOOS=linux GOARCH=arm64
        cp server/bin/multica output/multica-linux-arm64
        make build GOOS=darwin GOARCH=arm64
        cp server/bin/multica output/multica-darwin-arm64
        make build GOOS=darwin GOARCH=amd64
        cp server/bin/multica output/multica-darwin-amd64
        make build GOOS=windows GOARCH=amd64
        cp server/bin/multica.exe output/multica-windows-amd64.exe
        ls -l output
      cache:
        enable: true
        trimThresholdSize: 3
    check:
      - reuse: TASK
        enable: true
    artifacts:
      release: true

  # ---------------------------------------------------------------------------
  # web：只出前端站点（Next.js standalone 压缩包），用于单独出前端产物
  # ---------------------------------------------------------------------------
  - profile:
    name: web
    mode: AGENT
    environment:
      image: DECK_STD_CENTOS7
      resourceType: LARGE
      tools:
        - nodejs: 22.latest
        - pnpm: 10.13.1
    build:
      command: |
        set -euo pipefail
        # 构建机连不上 proxy.golang.org，Go 依赖走内网 goproxy
        export GOPROXY=https://goproxy.baidu-int.com,direct
        mkdir -p output
        npm i -g pnpm@10.28.2 --no-fund --no-audit
        pnpm install --frozen-lockfile
        STANDALONE=true pnpm --filter @multica/web build
        mkdir -p output/web
        cp -R apps/web/.next/standalone/. output/web/
        mkdir -p output/web/apps/web/.next
        cp -R apps/web/.next/static output/web/apps/web/.next/static
        cp -R apps/web/public output/web/apps/web/public
        tar -czf output/multica-web.tar.gz -C output/web .
        du -sh output/multica-web.tar.gz
      cache:
        enable: true
        trimThresholdSize: 6
    check:
      - reuse: TASK
        enable: true
    artifacts:
      release: true

  # ---------------------------------------------------------------------------
  # desktop_mac_arm64：Multica.app + dmg + zip（Apple Silicon）
  # 需要在 iPipe 里单独加阶段执行。MAC_STUDIO 只提供 cmake/go/protobuf/ruby/xcode，
  # 没有 node/pnpm，所以 node 和 pnpm 由命令自己拉（node 包复用内网 BOS 上的包）。
  # ---------------------------------------------------------------------------
  - profile:
    name: desktop_mac_arm64
    mode: AGENT
    environment:
      cluster: MAC_STUDIO
      tools:
        - xcode: 26.0.1
        - go: 1.26.5           # MAC_STUDIO 只有 1.26.5；打包会把 CLI 编进 app，go.mod 要求
                               # >= 1.26.9，靠 GOTOOLCHAIN=auto 从 goproxy 拉 1.26.9（本机已实测可拉）
    build:
      command: |
        set -euo pipefail
        # 构建机连不上 proxy.golang.org，Go 依赖走内网 goproxy
        export GOPROXY=https://goproxy.baidu-int.com,direct
        # node：拉免安装包（换成自己 BOS 上的 22.x 包时只改这一行地址和下面的目录名）
        curl -fsSL -o node-darwin.tar.gz https://dumate-app-public.bj.bcebos.com/app-build-dependence/nodejs/v26.5.0/node-v26.5.0-darwin-arm64.tar.gz
        tar -xzf node-darwin.tar.gz
        # 平台会把 $变量 替换成空，所以 PATH 写死字面量而不是 ${PATH}
        export PATH=./node-v26.5.0-darwin-arm64/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        node -v
        npm i -g pnpm@10.28.2 --no-fund --no-audit
        export GOTOOLCHAIN=auto
        # electron / electron-builder 的二进制默认走 GitHub，换成内网镜像
        export ELECTRON_MIRROR=https://dumate-app-public.bj.bcebos.com/app-build-dependence/electron/
        export ELECTRON_BUILDER_BINARIES_MIRROR=http://mirror.npm.baidu-int.com/electron-builder-binaries/
        mkdir -p output
        pnpm install --frozen-lockfile
        # --mac --arm64：产物在 apps/desktop/dist/mac-arm64/
        # --publish never：CI 只出包，不推 GitHub Release
        # CSC_IDENTITY_AUTO_DISCOVERY=false：没有苹果签名证书时走 ad-hoc 签名，否则会卡在找证书
        CSC_IDENTITY_AUTO_DISCOVERY=false pnpm --filter @multica/desktop package -- --mac --arm64 --publish never
        cp apps/desktop/dist/mac-arm64/*.dmg apps/desktop/dist/mac-arm64/*.zip output/
        ls -l output
      timeout: 7200
      cache:
        enable: false          # electron / electron-builder 缓存容易和版本标签错配
    check:
      - reuse: TASK
        enable: false
    artifacts:
      release: true

  # ---------------------------------------------------------------------------
  # desktop_win_x64：Windows 安装包（Linux 上交叉打包，复用 dumate 的 wine 镜像，
  # 镜像内自带 node20 + NSIS）。同样需要在 iPipe 里单独加阶段执行。
  # ---------------------------------------------------------------------------
  - profile:
    name: desktop_win_x64
    mode: AGENT
    environment:
      image: iregistry.baidu-int.com/dumate-crosscompile/electron-windows-cross-builder-node20-wine-bcloud:v1.0.2
      resourceType: MEDIUM
    build:
      command: |
        set -euo pipefail
        # 构建机连不上 proxy.golang.org，Go 依赖走内网 goproxy
        export GOPROXY=https://goproxy.baidu-int.com,direct
        # 镜像自带 node/npm，没有 pnpm，装一个和 packageManager 一致的版本
        npm i -g pnpm@10.28.2 --no-fund --no-audit
        export ELECTRON_MIRROR=https://dumate-app-public.bj.bcebos.com/app-build-dependence/electron/
        export ELECTRON_BUILDER_BINARIES_MIRROR=http://mirror.npm.baidu-int.com/electron-builder-binaries/
        mkdir -p output
        pnpm install --frozen-lockfile
        pnpm --filter @multica/desktop package -- --win --x64 --publish never
        cp apps/desktop/dist/win-x64/*.exe output/
        ls -l output
      timeout: 7200
      cache:
        enable: false
    check:
      - reuse: TASK
        enable: false
    artifacts:
      release: true
